{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Add vehicle</h2>
<form method="post" class="card p-4 form-card">
  <label class="form-label">Vehicle code</label><input class="form-control mb-3" name="vehicle_code" placeholder="e.g. CAR-003" required>
  <label class="form-label">Vehicle type</label><input class="form-control mb-3" name="vehicle_type" placeholder="e.g. SUV, Bike, Sedan" required>
  <label class="form-label">Fuel type</label><select class="form-select mb-3" name="fuel_type" required><option value="">Choose</option><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option><option>Hybrid</option></select>
  <button class="btn btn-primary">Save vehicle</button>
</form>
{% endblock %}
