{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Add fuel record</h2>
{% if not vehicles %}<div class="alert alert-warning">Add a vehicle before recording fuel.</div>{% endif %}
<form method="post" class="card p-4 form-card">
  <label class="form-label">Vehicle</label><select class="form-select mb-3" name="vehicle_id" required>{% for v in vehicles %}<option value="{{ v.vehicle_id }}">{{ v.vehicle_code }} — {{ v.vehicle_type }}</option>{% endfor %}</select>
  <label class="form-label">Fill date</label><input class="form-control mb-3" type="date" name="fill_date" required>
  <label class="form-label">Odometer reading (km)</label><input class="form-control mb-3" type="number" step="0.01" min="0" name="odometer_km" required>
  <label class="form-label">Fuel added (litres)</label><input class="form-control mb-3" type="number" step="0.001" min="0.001" name="litres" required>
  <label class="form-label">Total cost (₹)</label><input class="form-control mb-3" type="number" step="0.01" min="0" name="total_cost" required>
  <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="full_tank_flag" id="fullTank"><label class="form-check-label" for="fullTank">This purchase filled the tank completely</label></div>
  <p class="small text-muted">For accurate tank-to-tank mileage, mark full tank for consecutive readings. Partial-fill calculations are approximate.</p>
  <button class="btn btn-primary" {% if not vehicles %}disabled{% endif %}>Save record</button>
</form>
{% endblock %}
